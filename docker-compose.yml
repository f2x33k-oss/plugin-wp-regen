version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: core-postgres
    environment:
      POSTGRES_USER: core_user
      POSTGRES_PASSWORD: core_password
      POSTGRES_DB: core_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core_user -d core_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (for queue and cache)
  redis:
    image: redis:7-alpine
    container_name: core-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: core-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      API_PORT: 3000
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql://core_user:core_password@postgres:5432/core_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev-secret-change-in-production
      LOG_LEVEL: debug
      LOG_FORMAT: pretty
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages:/app/packages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: pnpm --filter @core/api dev

  # Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: core-worker
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://core_user:core_password@postgres:5432/core_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKER_CONCURRENCY: 3
      WORKER_ID: worker-docker-1
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LOG_LEVEL: debug
      LOG_FORMAT: pretty
    volumes:
      - ./apps/workers/src:/app/apps/workers/src
      - ./packages:/app/packages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: pnpm --filter @core/workers dev

volumes:
  postgres_data:
  redis_data:
