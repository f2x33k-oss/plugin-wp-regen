version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: recipe-postgres
    environment:
      POSTGRES_USER: recipeuser
      POSTGRES_PASSWORD: recipepass
      POSTGRES_DB: recipe_albums
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipeuser"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
